name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: macos-latest
          - os: ubuntu-latest

    runs-on: ${{ matrix.os }}

    steps:
      - name: Disable CRLF conversion
        run: git config --global core.autocrlf false

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev

      - name: Read pnpm version from package.json
        id: pnpm-ver
        shell: bash
        run: echo "version=$(sed -n 's/.*"packageManager".*"pnpm@\([^"]*\)".*/\1/p' package.json)" >> "$GITHUB_OUTPUT"

      - name: Setup Node 26
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 26

      # Node 25+ no longer ships Corepack: install the pnpm package.json names,
      # passed through env and checked to be an exact version before it is installed.
      - name: Install pnpm
        shell: bash
        env:
          PNPM_VERSION: ${{ steps.pnpm-ver.outputs.version }}
        run: |
          [[ $PNPM_VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::packageManager names no exact pnpm version: '$PNPM_VERSION'"; exit 1; }
          npm install -g "pnpm@$PNPM_VERSION"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Cache Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm build:shared

      # The desktop CSP (tauri.conf.json) names only the app's own hosts, while
      # avatars and space icons redirect to the deployment's object store and
      # their upload is a direct PUT to it. The release build merges that origin
      # into img-src / connect-src through a config overlay the Tauri CLI applies
      # over tauri.conf.json (apps/desktop/scripts/tauriCsp.mjs). The origin is a
      # deployment detail kept in a repository secret, never in the repository;
      # unset, the script prints {} and the base policy ships unchanged.
      - name: Write the release CSP overlay
        shell: bash
        env:
          TAURI_ASSET_ORIGIN: ${{ secrets.TAURI_ASSET_ORIGIN }}
        run: |
          if [ -z "${TAURI_ASSET_ORIGIN:-}" ]; then
            echo "::warning::TAURI_ASSET_ORIGIN is unset: the installers ship the base CSP and show no avatars or space icons"
          fi
          node apps/desktop/scripts/tauri-release-config.mjs > "$RUNNER_TEMP/tauri.release.json"

      - name: Build and release Tauri app
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_WS_URL: ${{ secrets.VITE_WS_URL }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          args: --config "${{ runner.temp }}/tauri.release.json"
          tagName: ${{ github.ref_name }}
          releaseName: 'Voxium ${{ github.ref_name }}'
          releaseDraft: false
          prerelease: false
