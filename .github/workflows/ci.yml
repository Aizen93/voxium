name: CI

on:
  push:
    branches: [develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck:
    name: Lint & Typecheck (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    # About 3 minutes (unit tests included); past 20 the run is hung
    timeout-minutes: 20
    # 26 is the supported runtime; 24 (maintenance until 2028-04) stays covered
    # for self-hosters until it is dropped from engines.node.
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read pnpm version from package.json
        id: pnpm-ver
        shell: bash
        run: echo "version=$(sed -n 's/.*"packageManager".*"pnpm@\([^"]*\)".*/\1/p' package.json)" >> "$GITHUB_OUTPUT"

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}

      # Node 25+ no longer ships Corepack: install the pnpm package.json names,
      # passed through env and checked to be an exact version before it is installed.
      - name: Install pnpm
        env:
          PNPM_VERSION: ${{ steps.pnpm-ver.outputs.version }}
        run: |
          [[ $PNPM_VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::packageManager names no exact pnpm version: '$PNPM_VERSION'"; exit 1; }
          npm install -g "pnpm@$PNPM_VERSION"

      # The store is where pnpm puts it by default (~/.local/share/pnpm/store
      # on Linux, under LOCALAPPDATA on Windows), never ~/.pnpm-store: that path
      # never existed, so this cache saved nothing ("Path Validation Error").
      - name: Locate the pnpm store
        id: pnpm-store
        shell: bash
        run: |
          dir=$(pnpm store path --silent)
          [ -n "$dir" ] || { echo "::error::pnpm named no store path"; exit 1; }
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.dir }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client (v7 — reads prisma.config.ts)
        working-directory: apps/server
        run: npx prisma generate

      # The crypto engine ships as a committed binary, so an edit to its Rust
      # source that was never rebuilt would pass every other check here and
      # then be absent from the installers release.yml builds.
      - name: Crypto engine WASM matches its Rust source
        run: pnpm --filter @voxium/crypto-engine check:wasm-fresh

      - name: Typecheck (shared -> server -> desktop -> admin)
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # What ships to users must have no high or critical advisory: this step fails
      # the job. An advisory reviewed as not applicable goes into
      # pnpm.auditConfig.ignoreGhsas in package.json, with the reason next to it.
      # A registry error fails it too (re-run the job): no answer is not a pass.
      - name: Security audit (production dependencies)
        if: matrix.node == 26
        run: pnpm audit --prod --audit-level=high

      # Build and test tooling: reported, never blocking.
      - name: Security audit (all dependencies, informational)
        if: matrix.node == 26
        run: pnpm audit --audit-level=high
        continue-on-error: true

      - name: Unit tests
        run: pnpm test
        env:
          JWT_SECRET: ci-test-secret
          JWT_REFRESH_SECRET: ci-test-refresh-secret

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    # Public repo: PRs come from forks with a read-only token — keep it that
    # way explicitly. Nothing in this job writes to the repo.
    permissions:
      contents: read
    # The slowest job by far, so don't spend ~20 runner-minutes on a branch
    # that does not even typecheck.
    needs: lint-typecheck
    # The suite is sequential (workers: 1, shared DB) and boots the real
    # stack, so ~10-15 min is normal. 30 is the hang ceiling: past that the
    # run is dead, and every extra minute just delays the red X.
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: voxium_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      # The email-verification specs assert on the "sent" confirmation, which
      # only appears once the transport actually accepts the message — without
      # a listener on 1025 nodemailer throws ESOCKET and those tests fail.
      mailpit:
        image: axllent/mailpit:v1.27
        ports:
          - 1025:1025
          - 8025:8025

    env:
      # Server boot requirements (index.ts refuses to start without these)
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/voxium_e2e?schema=public
      REDIS_URL: redis://127.0.0.1:6379
      JWT_SECRET: ci-e2e-secret-at-least-32-characters-long
      JWT_REFRESH_SECRET: ci-e2e-refresh-secret-at-least-32-chars
      TOTP_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      S3_ASSETS_ENDPOINT: http://127.0.0.1:9000
      S3_ASSETS_REGION: us-east-1
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_ASSETS_BUCKET: voxium-e2e
      PORT: 3001
      NODE_ENV: development
      # BOTH client origins: the desktop app (8080) and the admin app (8082).
      # With only 8080 the admin login preflight is refused and admin-flow
      # fails on "Login failed" — mirrors the multi-origin local .env.
      CORS_ORIGIN: http://localhost:8080,http://localhost:8082
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: 1025
      SMTP_FROM: ci@voxium.test
      SMTP_FROM_NAME: Voxium CI
      CLIENT_URL: http://localhost:8080
      # MEDIASOUP_ANNOUNCED_IP is set per-run to the runner's REAL address
      # (see the step below). Announcing 127.0.0.1 breaks Firefox: it will
      # not complete ICE/DTLS against loopback candidates, so every voice
      # transport dies on "DTLS connection failed" while Chromium sails
      # through. A real interface address is also what local dev and
      # production use — loopback was the odd one out.

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read pnpm version from package.json
        id: pnpm-ver
        shell: bash
        run: echo "version=$(sed -n 's/.*"packageManager".*"pnpm@\([^"]*\)".*/\1/p' package.json)" >> "$GITHUB_OUTPUT"

      - name: Setup Node 26
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      # Node 25+ no longer ships Corepack: install the pnpm package.json names,
      # passed through env and checked to be an exact version before it is installed.
      - name: Install pnpm
        env:
          PNPM_VERSION: ${{ steps.pnpm-ver.outputs.version }}
        run: |
          [[ $PNPM_VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::packageManager names no exact pnpm version: '$PNPM_VERSION'"; exit 1; }
          npm install -g "pnpm@$PNPM_VERSION"

      # The store is where pnpm puts it by default (~/.local/share/pnpm/store
      # on Linux, under LOCALAPPDATA on Windows), never ~/.pnpm-store: that path
      # never existed, so this cache saved nothing ("Path Validation Error").
      - name: Locate the pnpm store
        id: pnpm-store
        shell: bash
        run: |
          dir=$(pnpm store path --silent)
          [ -n "$dir" ] || { echo "::error::pnpm named no store path"; exit 1; }
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.dir }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Object storage: one spec performs a REAL presigned upload of an
      # encrypted attachment, so a stub endpoint is not enough. Kept as a plain
      # container (not a service) so the health wait and the bucket creation
      # live in the same step as the container they depend on.
      #
      # Image: MinIO's own registries (quay.io/minio/minio AND docker.io/minio/minio)
      # stopped serving anonymous pulls in autumn 2026 — every tag now answers
      # "unauthorized", which killed every E2E run before a single test started.
      # bitnamilegacy/minio is Bitnami's frozen, still-public build of MinIO
      # RELEASE.2025-07-23, pinned by digest so a tag move cannot change what
      # runs. Its entrypoint starts the server itself (no `server /data`
      # argument) and honours MINIO_ROOT_USER / MINIO_ROOT_PASSWORD.
      # The image pull has no limit of its own: a registry that stops
      # answering would hold the step until the job's 30 minutes
      - name: Start MinIO and create the assets bucket
        timeout-minutes: 5
        run: |
          # MINIO_SKIP_CLIENT: without it the image's entrypoint starts the
          # server in the background to configure its bundled client, stops
          # it, and starts it again. The readiness probe answers during that
          # first start, and a bucket call that meets the stop is reset: the
          # failure of 2026-11-13 on a PR branch (create reset, then no
          # bucket), and what the earlier ones are consistent with (develop
          # 2026-10-09, twice; a PR branch on 2026-11-09). The job uses the
          # root credentials and creates its bucket itself, so it needs none
          # of that setup, and with the variable the server starts once.
          docker run -d --name minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            -e MINIO_SKIP_CLIENT=yes \
            bitnamilegacy/minio:2025.7.23-debian-12-r5@sha256:6dabb4a2088c9a79908de3bc05f4586c23ad2182c8908e7e3acbf61c1467fb20
          # The step fails here, with the container's log, when the readiness
          # probe never answers: the loop used to fall through to the bucket
          # call, which hid the cause.
          ready=
          for i in $(seq 1 30); do
            if curl -fsS --max-time 5 -o /dev/null http://127.0.0.1:9000/minio/health/ready; then ready=1; break; fi
            sleep 2
          done
          if [ -z "$ready" ]; then
            echo "MinIO did not become ready within 60 s"
            docker logs minio
            exit 1
          fi
          # The bucket is there when head-bucket says so, and only then. Each
          # round asks, and creates when the answer is no; a create call whose
          # answer was lost, or that the server reset, is settled by the next
          # round's question, never by its own exit code (the CLI's own retry
          # of a create that had landed was answered BucketAlreadyOwnedByYou
          # and failed the step on a bucket that existed). The CLI makes one
          # attempt per call, with time limits (AWS_MAX_ATTEMPTS below, the
          # two --cli timeouts), so this loop is the only retry, and it is
          # bounded.
          endpoint=http://127.0.0.1:9000
          limits="--cli-connect-timeout 3 --cli-read-timeout 5"
          created=
          for i in $(seq 1 10); do
            if aws $limits --endpoint-url "$endpoint" s3api head-bucket --bucket "$S3_ASSETS_BUCKET" 2>/dev/null; then created=1; break; fi
            # Created: the next round confirms it at once. Not created: wait.
            aws $limits --endpoint-url "$endpoint" s3 mb "s3://$S3_ASSETS_BUCKET" && continue
            sleep 2
          done
          # The last round may have created it: one more question decides, and
          # its answer is printed when it is no.
          if [ -z "$created" ] && ! aws $limits --endpoint-url "$endpoint" s3api head-bucket --bucket "$S3_ASSETS_BUCKET"; then
            echo "The assets bucket was not there after 10 rounds"
            docker logs minio
            exit 1
          fi
        env:
          AWS_ACCESS_KEY_ID: minioadmin
          AWS_SECRET_ACCESS_KEY: minioadmin
          AWS_DEFAULT_REGION: us-east-1
          AWS_MAX_ATTEMPTS: 1

      - name: Generate Prisma client (v7 — reads prisma.config.ts)
        working-directory: apps/server
        run: npx prisma generate

      - name: Apply migrations
        working-directory: apps/server
        run: npx prisma migrate deploy

      # The key-share inbox statements on the real database (the route tests
      # mock Prisma). DATABASE_URL is the job's: the script reads no .env. It
      # imports the server's inbox module, which needs the built shared
      # package, and the e2e build of it only comes next.
      - name: Key-share inbox statements on PostgreSQL
        env:
          KEYSHARE_INBOX_CHECK: '1'
        run: |
          pnpm build:shared
          npx tsx scripts/check-keyshare-inbox.ts

      # The desktop app imports the BUILT shared package, so Vite would serve a
      # stale (or missing) dist without this.
      - name: Build shared
        run: pnpm build:shared

      # ~400MB of browser binaries — cached, this is seconds instead of
      # minutes. Keyed on the lockfile: a Playwright bump changes it, and the
      # binaries must match the driver version exactly.
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}

      # The browser binaries only; the OS packages are the next step's, on
      # both branches of the cache.
      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        timeout-minutes: 10
        run: npx playwright install chromium firefox

      # OS libraries are not part of the cached path and are installed on every
      # run: an apt pass of about 20 s. The script bounds and retries it, and
      # when the package mirrors cannot be reached it lets the job go on only
      # if both browsers start with what the runner image has. Unbounded, a
      # mirror outage (2026-11-11) ended three runs at the job's 30-minute
      # limit before a single test had started.
      - name: Install Playwright system deps
        timeout-minutes: 10
        run: bash .github/scripts/playwright-system-deps.sh

      # Playwright's webServer block boots the server, desktop and admin apps
      # and waits on their health checks.
      - name: Announce mediasoup on the runner's real IP
        run: |
          RUNNER_IP=$(hostname -I | awk '{print $1}')
          # An empty value would silently fall back to announcing 127.0.0.1
          # (the || default in mediasoupConfig), reintroducing the Firefox
          # DTLS failure with no visible cause. Refuse loudly instead.
          if [ -z "$RUNNER_IP" ]; then
            echo "Could not resolve the runner's IP — refusing to announce loopback"
            exit 1
          fi
          echo "MEDIASOUP_ANNOUNCED_IP=$RUNNER_IP" >> "$GITHUB_ENV"
          echo "MEDIASOUP_LISTEN_IP=0.0.0.0" >> "$GITHUB_ENV"
          echo "mediasoup will announce $RUNNER_IP"

      # Blocking gate. Excludes specs tagged @quarantine; none is tagged
      # today. A spec that fails at random is tagged (with a note in the spec
      # saying why) rather than left here: a merge gate that fails at random
      # trains everyone to ignore it.
      #
      # NODE_OPTIONS reaches the servers through Playwright's webServer, which
      # passes its own environment on (the configs set no `env`): every node
      # process of the run loads scripts/lib/pg-overlap-guard.cjs, which
      # records each query issued on a pg client already running one. The
      # "No concurrent queries" step below fails the job on any record.
      - name: E2E tests (Chromium)
        env:
          NODE_OPTIONS: --require ${{ github.workspace }}/scripts/lib/pg-overlap-guard.cjs --trace-deprecation
          PG_OVERLAP_REPORT: ${{ runner.temp }}/pg-overlaps.jsonl
          # Read by "Tests that passed only on a retry" below
          PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ runner.temp }}/playwright-chromium.json
        run: npx playwright test --grep-invert @quarantine --reporter=github,line,json

      # The flagship E2E-voice proof is the one place a second browser engine
      # earns its runtime: it exercises the RTCRtpScriptTransform path that
      # Chromium's legacy insertable-streams path never touches.
      - name: E2E secure voice (Firefox — cross-engine transform path)
        env:
          NODE_OPTIONS: --require ${{ github.workspace }}/scripts/lib/pg-overlap-guard.cjs --trace-deprecation
          PG_OVERLAP_REPORT: ${{ runner.temp }}/pg-overlaps.jsonl
          PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ runner.temp }}/playwright-firefox.json
        run: npx playwright test secure-voice --config=playwright-firefox.config.ts --reporter=github,line,json

      # Visible but non-blocking, so a quarantined spec cannot rot silently:
      # the step goes red in the UI while the job still passes. The script
      # lists the tagged specs first and, when there is none, ends without
      # starting the stack (Playwright would boot all three apps to find
      # nothing); a listing it cannot read runs them as before. Its overlap
      # records go to a file of their own, reported as a warning only, and it
      # tells the next step whether it ran (`ran`). The limit keeps a hung
      # quarantined run from spending the rest of the job's 30 minutes, which
      # would fail the job: past it the step fails, and stays non-blocking.
      - name: E2E quarantined specs (non-blocking)
        id: quarantine
        continue-on-error: true
        timeout-minutes: 10
        env:
          NODE_OPTIONS: --require ${{ github.workspace }}/scripts/lib/pg-overlap-guard.cjs --trace-deprecation
          PG_OVERLAP_REPORT: ${{ runner.temp }}/pg-overlaps-quarantine.jsonl
        run: bash .github/scripts/e2e-quarantine.sh --reporter=github,line

      # Two queries at once on one pg connection: pg 8 queues them (and warns
      # once per process, from the third), pg 9 removes the queueing. The
      # source-side rule is apps/server/src/__tests__/utils/transactionRelationLoads.test.ts.
      - name: No concurrent queries on one pg connection
        if: ${{ !cancelled() }}
        env:
          REPORT: ${{ runner.temp }}/pg-overlaps.jsonl
          QUARANTINE_REPORT: ${{ runner.temp }}/pg-overlaps-quarantine.jsonl
          # 'false' only when no spec was tagged and the stack never started
          QUARANTINE_RAN: ${{ steps.quarantine.outputs.ran }}
        run: |
          # An empty report proves nothing unless the guard armed in the
          # server itself: each arming process leaves a line in <report>.armed
          if [ "$QUARANTINE_RAN" = "false" ]; then
            echo "No spec is tagged @quarantine: no quarantined run to check."
          else
            if ! grep -qs 'apps/server/src/index.ts' "$QUARANTINE_REPORT.armed"; then
              echo "::warning::the pg overlap guard did not arm in the server during the quarantined specs"
            fi
            if [ -s "$QUARANTINE_REPORT" ]; then
              echo "::warning::$(wc -l < "$QUARANTINE_REPORT") pg queries issued on a busy client during the quarantined specs"
              cat "$QUARANTINE_REPORT"
            fi
          fi
          if ! grep -qs 'apps/server/src/index.ts' "$REPORT.armed"; then
            echo "::error::the pg overlap guard never armed in the server process (no apps/server/src/index.ts line in $REPORT.armed), so an empty report would prove nothing. Is @prisma/adapter-pg still resolvable from apps/server?"
            cat "$REPORT.armed" 2>/dev/null || true
            exit 1
          fi
          if [ -s "$REPORT" ]; then
            echo "::error::$(wc -l < "$REPORT") pg queries issued on a busy client (two queries at once on one connection)"
            cat "$REPORT"
            exit 1
          fi
          echo "No query was issued on a busy pg client (guard armed in: $(grep -c 'apps/server/src/index.ts' "$REPORT.armed") server process(es))."

      # The gate retries a failed test twice (playwright.config.ts), so a test
      # that fails at random still passes it. Every such test of the two
      # blocking runs is listed in the job summary and as a warning on its own
      # line; this step never fails the job (whether a flaky test should is a
      # decision of its own), so a fault of the script itself shows on the step
      # and stops nothing.
      - name: Tests that passed only on a retry
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          CHROMIUM_REPORT: ${{ runner.temp }}/playwright-chromium.json
          FIREFOX_REPORT: ${{ runner.temp }}/playwright-firefox.json
        run: node .github/scripts/playwright-flaky-summary.mjs "Chromium=$CHROMIUM_REPORT" "Firefox secure voice=$FIREFOX_REPORT"

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: MinIO logs (on failure)
        if: failure()
        run: docker logs minio || true

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    # Seconds in practice
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Gitleaks (secrets detection)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false

  build:
    name: Build
    runs-on: ubuntu-latest
    # About a minute; past 15 the run is hung
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read pnpm version from package.json
        id: pnpm-ver
        shell: bash
        run: echo "version=$(sed -n 's/.*"packageManager".*"pnpm@\([^"]*\)".*/\1/p' package.json)" >> "$GITHUB_OUTPUT"

      - name: Setup Node 26
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      # Node 25+ no longer ships Corepack: install the pnpm package.json names,
      # passed through env and checked to be an exact version before it is installed.
      - name: Install pnpm
        env:
          PNPM_VERSION: ${{ steps.pnpm-ver.outputs.version }}
        run: |
          [[ $PNPM_VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::packageManager names no exact pnpm version: '$PNPM_VERSION'"; exit 1; }
          npm install -g "pnpm@$PNPM_VERSION"

      # The store is where pnpm puts it by default (~/.local/share/pnpm/store
      # on Linux, under LOCALAPPDATA on Windows), never ~/.pnpm-store: that path
      # never existed, so this cache saved nothing ("Path Validation Error").
      - name: Locate the pnpm store
        id: pnpm-store
        shell: bash
        run: |
          dir=$(pnpm store path --silent)
          [ -n "$dir" ] || { echo "::error::pnpm named no store path"; exit 1; }
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.dir }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client (v7 — reads prisma.config.ts)
        working-directory: apps/server
        run: npx prisma generate

      - name: Build shared
        run: pnpm build:shared

      - name: Build server
        run: pnpm build:server

      - name: Build desktop
        run: pnpm build:desktop

      - name: Build admin
        run: pnpm build:admin
