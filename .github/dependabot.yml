# Weekly, grouped update proposals. Security alerts stay on in the repository
# settings; this file adds the routine version updates that keep the alert count
# from piling up between releases.
#
# packages/crypto-engine is deliberately absent: vodozemac is pinned exactly and
# watched by crypto-deps-watch.yml, and every change there needs a WASM rebuild.
#
# The Tauri family (the tauri* crates and the @tauri-apps/* packages) moves only
# by hand, all of it at once: the CLI refuses a crate and an @tauri-apps/api of
# different minors, and CI builds no Rust, so a bot PR that moved one side would
# pass here and break the release build. Patch updates still come through.
#
# Every entry waits three days after a release before proposing it, the same
# window as minimumReleaseAge in pnpm-workspace.yaml.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    open-pull-requests-limit: 5
    groups:
      production:
        dependency-type: production
        update-types: [minor, patch]
      development:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      - dependency-name: "@tauri-apps/*"
        update-types: ["version-update:semver-minor"]

  - package-ecosystem: cargo
    directory: /apps/desktop/src-tauri
    target-branch: develop
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    open-pull-requests-limit: 3
    groups:
      desktop-shell:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "tauri*"
        update-types: ["version-update:semver-minor"]

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      actions:
        update-types: [minor, patch]
