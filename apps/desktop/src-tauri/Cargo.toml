[package]
name = "voxium"
version = "2.1.1"
description = "Voxium - Modern voice & text communication platform"
authors = ["Voxium Team"]
edition = "2021"

[lib]
name = "voxium_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png", "tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# A second launch hands over to the running app instead of starting another
# one (src/lib.rs): registered first, in release builds.
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "3"
# OS keychain for the E2E pickle key (docs/e2e-dm-spec.md §7.3):
# Windows Credential Manager / macOS Keychain / Linux Secret Service.
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service", "vendored"] }

[target.'cfg(target_os = "windows")'.dependencies]
tauri-winrt-notification = "0.7"
# Hiding WebView2's screen-share bar (src/share_bar.rs): the same webview2-com
# and windows-core versions wry links, so the controller types are one type.
webview2-com = "0.39"
windows-core = "0.100"
# Win32_System_Console: the debug build's Ctrl-C handler (src/dev_console.rs)
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console", "Win32_UI_WindowsAndMessaging"] }
