[package]
name = "voxium-crypto-engine"
version = "0.1.0"
edition = "2021"
description = "Voxium E2E crypto engine v1 (olm1): thin wasm-bindgen marshalling layer over vodozemac. No crypto logic lives in this crate or in JS — all key derivation, ratcheting, and signature verification happen inside vodozemac."
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# SECURITY: pinned exactly. 0.10.0 shipped the Feb-2026 defense-in-depth
# fixes (fallible all-zero DH check, strict Ed25519 verification by
# default); 0.11.1 (reviewed 2026-10-14) keeps them and adds HPKE and a
# libolm-import one-time-key fix. None of its breaking changes touch the
# APIs this crate uses, and the Olm/Megolm wire and pickle formats are
# unchanged: fixtures written by 0.10.0 (apps/desktop/src/__tests__/e2e/
# fixtures/vodozemac-0.10.0.json) must keep opening under the current pin.
# Bump only after reviewing the changelog + RustSec advisories (see
# .github/workflows/crypto-deps-watch.yml) and re-running that test.
vodozemac = "=0.11.1"
# E2E attachment file encryption (AES-256-GCM). RustCrypto, same family as
# vodozemac's own internals; keeps file crypto out of JS entirely.
aes-gcm = "0.10"
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
sha2 = "0.10"
zeroize = "1"
# wasm32-unknown-unknown has no OS entropy source: each getrandom major in
# the tree must be told to use the browser/runtime WebCrypto getRandomValues,
# or the build fails (it never falls back to a weak source). 0.2 ("js") is
# aes-gcm's, for the attachment cipher; 0.4 ("wasm_js") is vodozemac 0.11's.
# Neither is called from this crate: both lines exist only to turn the
# feature on for the whole tree (cargo unifies features), so an "unused
# dependency" cleanup must leave them — without them the WASM build fails.
getrandom = { version = "0.2", features = ["js"] }
getrandom_04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }

[profile.release]
opt-level = "s"
lto = true
